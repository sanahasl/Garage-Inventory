<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Garage Inventory{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="/">🔧 Garage Inventory</a>
      </div>
      <div class="container" style="text-align=right;">
        <a class="btn btn-outline-light btn-sm" href="/admin/">Admin</a>
        <a
          class="btn btn-outline-light btn-sm me-2"
          href="{% url 'part_list' %}"
          >Parts</a
        >
      </div>
    </nav>

    <main class="container pb-5">{% block content %}{% endblock %}</main>

    {% block scripts %}{% endblock %}
  </body>
</html>
